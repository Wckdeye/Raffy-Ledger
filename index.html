<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raffy's Ledger</title>
<meta name="theme-color" content="#090C12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: single phone column, instrument-panel cards on a deep graphite ground; one electric accent, mono readouts, line icons in tinted tiles */
:root{
  --bg:#090C12; --surface:#10151F; --surface-2:#171E2B; --line:#212A3A; --ink:#E8EDF7; --muted:#8792A8;
  --accent:#7B9CFF; --accent-ink:#0A0E18; --in:#47E0BD; --out:#FF7D6E; --warn:#FFC15A;
  --grid:rgba(123,156,255,.09); --halo:rgba(123,156,255,.22);
  --glow:0 0 0 1px rgba(123,156,255,.55);
  --f-display:"Sora",ui-rounded,system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EBEFF6; --line:#DCE2EC; --ink:#0E1420; --muted:#5B6577;
  --accent:#3356E0; --accent-ink:#FFFFFF; --in:#0C9A76; --out:#D64C3B; --warn:#B07400;
  --grid:rgba(51,86,224,.07); --halo:rgba(51,86,224,.14);
  --glow:0 0 0 1px rgba(51,86,224,.55);
  color-scheme:light}}

*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(104px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.in{color:var(--in)} .out{color:var(--out)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em;font-weight:600}
.eyebrow{font-family:var(--f-num);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}

.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile{--c:var(--accent);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--c);
  background:color-mix(in srgb,var(--c) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 26%,transparent)}
.tile.sm{width:30px;height:30px;border-radius:9px}
.tile.sm .ic{width:16px;height:16px}
.t-expense{--c:var(--out)} .t-income,.t-ar_collect{--c:var(--in)} .t-transfer{--c:var(--accent)} .t-ar_charge{--c:var(--warn)} .t-neutral{--c:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:21px}
.mswitch{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.mswitch button{border:0;background:none;width:32px;height:32px;border-radius:999px;font-size:18px;line-height:1;color:var(--muted)}
.mswitch span{font-family:var(--f-num);font-weight:500;font-size:12.5px;min-width:84px;text-align:center;letter-spacing:.02em}

.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.section-h h2{font-size:16px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 0}

.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(160deg,#000 10%,transparent 75%);mask-image:linear-gradient(160deg,#000 10%,transparent 75%)}
.hero::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-120px;pointer-events:none;background:radial-gradient(closest-side,var(--halo),transparent)}
.hero>*{position:relative}
.hero .big{font-family:var(--f-num);font-size:clamp(30px,9vw,40px);font-weight:600;letter-spacing:-.035em;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:.48em;color:var(--muted);font-weight:500}
.hero-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.hero-grid div{min-width:0}
.hero-grid .v{font-family:var(--f-num);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hero-grid .k{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.hero-grid .k .ic{width:14px;height:14px}

.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px;font-size:12px;font-weight:600;color:var(--ink)}
.quick button:active{transform:scale(.97)}

.pl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pl div{min-width:0}
.pl .v{font-family:var(--f-num);font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .k{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13.5px}
.bar-row .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px}
.bar-row .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{grid-column:2/-1;height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--out);border-radius:99px}
.bar-fill.inc{background:var(--in)}
.bar-row .tile{grid-row:span 2}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.rows .row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;font-size:14px;white-space:nowrap}
.day-h{font-family:var(--f-num);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap;--c:var(--muted);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pill.ok{--c:var(--in)} .pill.warn{--c:var(--warn)} .pill.bad{--c:var(--out)}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

.cc{display:flex;flex-direction:column;gap:12px}
.cc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cc-id{display:flex;align-items:center;gap:12px;min-width:0}
.cc-id>div{min-width:0}
.cc-top h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-owed{text-align:right}
.cc-owed .v{font-family:var(--f-num);font-weight:600;font-size:17px;white-space:nowrap}
.stmt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stmt div{min-width:0}
.stmt .k{font-size:11.5px;color:var(--muted)}
.stmt .v{font-family:var(--f-num);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px}
.btn .ic{width:17px;height:17px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--glow)}
.btn.danger{color:var(--out)}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}

.aging{display:flex;gap:3px;height:6px;margin:12px 0 10px}
.aging span{height:100%;border-radius:99px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:5px}
.a0{background:var(--in)} .a1{background:var(--warn)} .a2{background:var(--out)}

.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty p{margin:0 auto 14px;max-width:34ch}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;border:0;background:none;padding:7px 2px 5px;border-radius:10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button .ic{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:50%;width:22px;height:2px;margin-left:-11px;border-radius:2px;background:var(--accent)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(80px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 28px rgba(0,0,0,.35);display:grid;place-items:center}
.fab .ic{width:26px;height:26px;stroke-width:2.3}
@media (min-width:640px){.fab{right:calc(50% - 280px + 4px)}}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,6,12,.6);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-top:1px solid var(--line);
  border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h2{font-size:18px}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:99px;font-size:18px;line-height:1;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s cubic-bezier(.2,.8,.3,1)}@keyframes up{from{transform:translateY(30px);opacity:.4}}}

.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;border-radius:11px;padding:8px 2px 7px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button .ic{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.seg button[aria-pressed="true"][data-type="expense"]{color:var(--out)}
.seg button[aria-pressed="true"][data-type="income"],.seg button[aria-pressed="true"][data-type="collect"]{color:var(--in)}
.seg button[aria-pressed="true"][data-type="transfer"]{color:var(--accent)}
.amt-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.amt-wrap:focus-within{border-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
.amt-wrap span{font-family:var(--f-num);font-size:26px;color:var(--muted)}
.amt-input{border:0;background:none;outline:none;font-family:var(--f-num);font-size:36px;font-weight:600;width:100%;min-width:0;padding:0;letter-spacing:-.03em}
.field{display:flex;flex-direction:column;gap:8px}
.field>.lbl,.lbl{font-family:var(--f-num);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.input,.select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.input:focus,.select:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input,.tpick input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px 7px 10px;font-size:13.5px;font-weight:500;cursor:pointer;user-select:none}
.chip span .ic{width:16px;height:16px;color:var(--muted)}
.chip input:checked+span{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-color:var(--accent);color:var(--ink);box-shadow:var(--glow)}
.chip input:checked+span .ic{color:var(--accent)}
.chip input:focus-visible+span,.tpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tpick{position:relative;min-width:0}
.tpick span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:78px;padding:10px 4px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  font-size:11.5px;font-weight:600;line-height:1.2;text-align:center;color:var(--muted);cursor:pointer;user-select:none;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.tpick span .ic{width:22px;height:22px;color:var(--ink)}
.tpick input:checked+span{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 13%,var(--surface));box-shadow:var(--glow)}
.tpick input:checked+span .ic{color:var(--accent)}
.btnchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.btnchip .ic{width:15px;height:15px}
.btnchip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.err{color:var(--out);font-size:13px;font-weight:600}
.err:empty{display:none}
.hint{font-size:12.5px;color:var(--muted)}
.tag-x{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 6px 5px 10px;font-size:13px}
.tag-x .ic{width:15px;height:15px;color:var(--muted)}
.tag-x button{border:0;background:var(--surface-2);width:22px;height:22px;border-radius:99px;line-height:1;color:var(--muted)}
.inline-add{display:flex;gap:8px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(152px + env(safe-area-inset-bottom,0px));background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.bad{background:var(--out);color:#fff;border-color:var(--out)}
.setup-row,.sb-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,8.5rem);gap:10px;align-items:center}
.sb-name{min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-name small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.sb-list{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">Ledger</h1>
    <div class="mswitch" id="mswitch" hidden>
      <button type="button" id="mprev" aria-label="Previous month">‹</button>
      <span id="mlabel"></span>
      <button type="button" id="mnext" aria-label="Next month">›</button>
    </div>
  </header>
  <main id="view" class="stack"></main>
</div>

<button type="button" class="fab" id="fab" aria-label="Add entry" hidden></button>
<nav class="nav" id="nav" hidden><div class="nav-in" id="nav-in"></div></nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>

function billMonth(list, mk) {

  save(); toast(`Billed ${list.length} for ${mName(mk)}`);
}

$("#importfile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let parsed; try { parsed = JSON.parse(await f.text()); } catch { return toast("That file isn't a ledger backup.", true); }
  const d = parsed?.data; if (!d || typeof d !== "object" || !d.accounts) return toast("That file isn't a ledger backup.", true);
  const box = $("#importconfirm"); if (!box) return;
  box.innerHTML = `<div class="banner warn" style="flex-wrap:wrap"><span>Replace everything on this phone with this backup (${Object.keys(d.txns || {}).length} entries${parsed.exported ? ", from " + esc(dShort(parsed.exported.slice(0, 10))) : ""})?</span><div class="actions"><button type="button" class="btn danger" id="doimport">Replace</button><button type="button" class="btn" id="noimport">Cancel</button></div></div>`;
  $("#noimport").onclick = () => box.innerHTML = "";
  $("#doimport").onclick = () => { S.data = normalize(d); save(); toast("Backup restored"); };
};
function exportCSV() {
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [["Date", "Type", "Category", "Account", "To account", "Person", "Amount", "Note"].join(",")];
  allTxns().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => lines.push([t.date, t.type, q(t.cat), q(t.acct ? accName(t.acct) : ""), q(t.to ? accName(t.to) : ""), q(t.person ? pName(t.person) : ""), (t.amt / 100).toFixed(2), q(t.note)].join(",")));
  download(`ledger-${today()}.csv`, lines.join("\n"), "text/csv"); toast("CSV saved to Downloads");
}

    });
    if (bad) { $("#setup-err").textContent = "One of the balances isn't a number. Use digits like 12,500.00."; return; }
    S.data = normalize({accounts: accs, people: {}, cats: clone(DEFAULT_CATS), txns: {}, created: today()});
    save(); toast("Books created");
  };
}

/* ---------- sheets ---------- */
function openTxn(o = {}) {
  const e = o.edit;
  let type = e ? (e.type === "ar_collect" ? "collect" : e.type) : (o.type || pref.get("lastType", "expense"));
  const last = pref.get("lastAcct", {});
  const html = `
  <div class="seg" role="group" aria-label="Type">${TYPES.map(([k, l, ic]) => `<button type="button" data-type="${k}" aria-pressed="${k === type}">${ico(ic)}${l}</button>`).join("")}</div>
  <div class="amt-wrap"><span>₱</span><input class="amt-input" id="f-amt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${amtVal(e?.amt || o.amt)}" aria-label="Amount"></div>
  <div id="f-dyn" class="stack" style="gap:16px"></div>
  <div class="grid2"><label class="field"><span class="lbl">Date</span><input class="input" type="date" id="f-date" value="${e?.date || today()}"></label>
    <label class="field"><span class="lbl">Note</span><input class="input" id="f-note" maxlength="80" placeholder="Optional" value="${esc(e?.note || "")}"></label></div>
  <div class="err" id="f-err" role="alert"></div>
  <button type="button" class="btn primary block" id="f-save">${ico("check")}${e ? "Save changes" : "Save"}</button>
  ${e ? `<button type="button" class="btn danger block" id="f-del">Delete</button>` : ""}`;
  openSheet(e ? "Edit entry" : "New entry", html, root => {
    const sel = {cat: e?.cat, acct: e?.acct, to: e?.to || o.to, person: e?.person || o.person};
    const dyn = root.querySelector("#f-dyn");
    const capture = () => ["cat", "acct", "to", "person"].forEach(k => { const x = val(dyn, k); if (x) sel[k] = x; });
    function draw() {
      const all = accChips(() => true), assets = accChips(a => kindOf(a) === "asset");
      if (type === "expense") dyn.innerHTML = `<div class="field"><span class="lbl">Category</span>${tilesHTML("cat", S.data.cats.expense.map(c => [c, c, catIcon(c)]), sel.cat)}</div><div class="field"><span class="lbl">Paid with</span>${chipsHTML("acct", all, sel.acct || last.expense)}</div>`;
      else if (type === "income") dyn.innerHTML = `<div class="field"><span class="lbl">Income stream</span>${tilesHTML("cat", S.data.cats.income.map(c => [c, c, catIcon(c)]), sel.cat)}</div><div class="field"><span class="lbl">Received in</span>${chipsHTML("acct", all, sel.acct || last.income)}</div>`;
      else if (type === "transfer") dyn.innerHTML = `<div class="field"><span class="lbl">From</span>${chipsHTML("acct", all, sel.acct || last.transfer)}</div><div class="field"><span class="lbl">To</span>${chipsHTML("to", all, sel.to)}</div><p class="hint" style="margin:0">Paying a card or SPayLater? From your bank, to the card. Putting money into Pickle Jar? To Pickle Jar capital.</p>`;
      else if (type === "collect") { const ps = people().map(p => [p.id, p.name, KINDS[p.kind].icon]);
        dyn.innerHTML = ps.length ? `<div class="field"><span class="lbl">Who paid you</span>${chipsHTML("person", ps, sel.person)}</div><div class="field"><span class="lbl">Deposited to</span>${chipsHTML("acct", assets, sel.acct || last.collect)}</div>` : `<p class="hint" style="margin:0">Add people in the "Owed to me" tab first.</p>`; }
    }
    draw();
    root.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { capture(); type = b.dataset.type; root.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-pressed", x === b)); root.querySelector("#f-err").textContent = ""; draw(); });
    const amtI = root.querySelector("#f-amt"); if (!e && !o.amt) setTimeout(() => amtI.focus(), 60);
    root.querySelector("#f-save").onclick = () => {
      const err = m => root.querySelector("#f-err").textContent = m;
      const amt = parseAmt(amtI.value); if (!amt) return err("Enter an amount greater than zero.");
      const date = root.querySelector("#f-date").value; if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err("Pick a date.");
      const note = root.querySelector("#f-note").value.trim(); const g = k => val(dyn, k);
      const t = {id: e?.id || newId(), amt, date, at: e?.at || Date.now()}; if (note) t.note = note;
      if (type === "expense" || type === "income") { t.type = type; t.cat = g("cat"); t.acct = g("acct"); if (!t.cat) return err("Pick a category."); if (!t.acct) return err("Pick an account."); }
      else if (type === "transfer") { t.type = "transfer"; t.acct = g("acct"); t.to = g("to"); if (!t.acct || !t.to) return err("Pick both accounts."); if (t.acct === t.to) return err("From and To must be different accounts."); }
      else if (type === "collect") { t.type = "ar_collect"; t.person = g("person"); t.acct = g("acct"); if (!t.person) return err("Pick who paid you."); if (!t.acct) return err("Pick where you deposited it."); }
      if (!e) { pref.set("lastType", type); const la = pref.get("lastAcct", {}); la[type] = t.acct; pref.set("lastAcct", la); }
      putTxn(t); closeSheet(); toast(e ? "Saved" : "Added");
    };
    const del = root.querySelector("#f-del");
    if (del) { let armed = false; del.onclick = () => { if (!armed) { armed = true; del.textContent = "Tap again to delete"; return; } delTxn(e.id); closeSheet(); toast("Deleted"); }; }
  });
}
function openCharge(pid, edit) {
  const p = S.data.people[pid]; const loan = p.kind === "loan";
  const last = pref.get("lastAcct", {});
  openSheet(edit ? "Edit charge" : (loan ? "Lend to " : "Charge ") + p.name, `
  <div class="amt-wrap"><span>₱</span><input class="amt-input" id="c-amt" inputmode="decimal" placeholder="0.00" value="${amtVal(edit?.amt || (!loan && p.monthly) || 0)}" aria-label="Amount"></div>
  ${loan ? `<div class="field"><span class="lbl">Lent from</span>${chipsHTML("acct", accChips(a => kindOf(a) === "asset"), edit?.acct || last.lend)}</div>` : `<p class="hint" style="margin:0">Counts as ${esc(KINDS[p.kind].income)} income on this date and adds to what ${esc(p.name)} owes you.</p>`}
  <div class="grid2"><label class="field"><span class="lbl">Date</span><input class="input" type="date" id="c-date" value="${edit?.date || today()}"></label>
    <label class="field"><span class="lbl">Note</span><input class="input" id="c-note" maxlength="80" placeholder="Optional" value="${esc(edit?.note || "")}"></label></div>
  <div class="err" id="c-err"></div>
  <button type="button" class="btn primary block" id="c-save">${ico("check")}${edit ? "Save changes" : "Save"}</button>
  ${edit ? `<button type="button" class="btn danger block" id="c-del">Delete</button>` : ""}`, root => {
    root.querySelector("#c-save").onclick = () => {
      const err = m => root.querySelector("#c-err").textContent = m;
      const amt = parseAmt(root.querySelector("#c-amt").value); if (!amt) return err("Enter an amount greater than zero.");
      const date = root.querySelector("#c-date").value; if (!date) return err("Pick a date.");
      const t = {id: edit?.id || newId(), type: "ar_charge", person: pid, amt, date, at: edit?.at || Date.now()};
      if (edit?.period) t.period = edit.period;
      const note = root.querySelector("#c-note").value.trim(); if (note) t.note = note;
      if (loan) { t.acct = val(root, "acct"); if (!t.acct) return err("Pick the account the money came from."); const la = pref.get("lastAcct", {}); la.lend = t.acct; pref.set("lastAcct", la); }
      putTxn(t); closeSheet(); toast(edit ? "Saved" : loan ? "Loan recorded" : "Charged");
    };
    const del = root.querySelector("#c-del");
    if (del) { let armed = false; del.onclick = () => { if (!armed) { armed = true; del.textContent = "Tap again to delete"; return; } delTxn(edit.id); closeSheet(); toast("Deleted"); }; }
  });
}
function openStartBalances() {
  const accs = accounts(true), ps = people(true);
  const row = (attr, id, icon, cls, name, sub, v) => `<label class="sb-row"><span class="tile sm ${cls}">${ico(icon)}</span><span class="sb-name">${esc(name)}<small>${sub}</small></span><input class="input num" ${attr}="${id}" inputmode="decimal" placeholder="0.00" value="${amtVal(v)}" aria-label="${esc(name)} starting amount"></label>`;
  openSheet("Starting balances", `
  <p class="hint" style="margin:0">What each account held when you started tracking. For cards and pay later, what you owed. Changing a starting balance shifts its current balance by the same amount; your entries stay as they are.</p>
  <div class="lbl">Accounts</div>
  <div class="sb-list">${accs.map(a => row("data-sba", a.id, GROUPS[a.group].icon, kindOf(a) === "liability" ? "t-expense" : "t-transfer", a.name, kindOf(a) === "liability" ? "Owed at start" : "Held at start", a.opening)).join("")}</div>
  ${ps.length ? `<div class="lbl">Already owed to you at start</div><div class="sb-list">${ps.map(p => row("data-sbp", p.id, KINDS[p.kind].icon, "t-ar_charge", p.name, KINDS[p.kind].label, p.opening)).join("")}</div>` : ""}
  <div class="err" id="sb-err"></div>
  <button type="button" class="btn primary block" id="sb-save">${ico("check")}Save balances</button>`, root => {
    root.querySelector("#sb-save").onclick = () => {
      let bad = null; const A = {}, Pp = {};
      const read = (sel, out) => root.querySelectorAll(`[${sel}]`).forEach(i => { const r = i.value.trim(); const v = r ? parseAmt(r) : 0; if (r && v == null && !isZeroish(r)) bad = bad || i; out[i.getAttribute(sel)] = v || 0; });
      read("data-sba", A); read("data-sbp", Pp);
      if (bad) { root.querySelector("#sb-err").textContent = "One of the amounts isn't a number. Use digits like 12,500.00."; bad.focus(); return; }
      for (const k in A) if (S.data.accounts[k]) S.data.accounts[k].opening = A[k];
      for (const k in Pp) if (S.data.people[k]) S.data.people[k].opening = Pp[k];
      save(); closeSheet(); toast("Starting balances updated");
    };
  });
}
function openStatement(id) {
  const a = S.data.accounts[id]; const s = a.stmt || {};
  openSheet(a.name + " statement", `
  <div class="grid2">
    <label class="field"><span class="lbl">Statement date</span><input class="input" type="date" id="s-date" value="${s.date || today()}"></label>
    <label class="field"><span class="lbl">Payment due</span><input class="input" type="date" id="s-due" value="${s.due || ""}"></label>
    <label class="field"><span class="lbl">Statement balance</span><input class="input num" id="s-bal" inputmode="decimal" placeholder="0.00" value="${amtVal(s.bal)}"></label>
    <label class="field"><span class="lbl">Minimum due</span><input class="input num" id="s-min" inputmode="decimal" placeholder="0.00" value="${amtVal(s.min)}"></label>
  </div>
  <p class="hint" style="margin:0">Payments you log from the statement date onward count toward this bill.</p>
  <div class="err" id="s-err"></div>
  <button type="button" class="btn primary block" id="s-save">${ico("check")}Save statement</button>`, root => {
    root.querySelector("#s-save").onclick = () => {
      const E = m => root.querySelector("#s-err").textContent = m;
      const date = root.querySelector("#s-date").value, due = root.querySelector("#s-due").value;
      const bal = parseAmt(root.querySelector("#s-bal").value), minRaw = root.querySelector("#s-min").value.trim(), min = minRaw ? parseAmt(minRaw) : 0;
      if (!date || !due) return E("Enter both the statement date and the due date.");
      if (!bal) return E("Enter the statement balance.");
      if (minRaw && min == null && !isZeroish(minRaw)) return E("Minimum due must be a number.");
      a.stmt = {date, due, bal, min: min || 0}; save(); closeSheet(); toast("Statement saved");
    };
  });
}
function openAccount(id) {
  const a = id ? S.data.accounts[id] : {name: "", group: "bank", opening: 0};
  openSheet(id ? "Edit account" : "New account", `
  <label class="field"><span class="lbl">Name</span><input class="input" id="a-name" maxlength="40" value="${esc(a.name)}" placeholder="e.g. BPI savings"></label>
  <div class="field"><span class="lbl">Type</span>${tilesHTML("grp", Object.entries(GROUPS).map(([k, g]) => [k, g.label, g.icon]), a.group)}</div>
  <div class="grid2">
    <label class="field"><span class="lbl" id="a-open-l">Starting balance</span><input class="input num" id="a-open" inputmode="decimal" placeholder="0.00" value="${amtVal(a.opening)}"></label>
    <label class="field" id="a-limit-f"><span class="lbl">Credit limit</span><input class="input num" id="a-limit" inputmode="decimal" placeholder="Optional" value="${amtVal(a.limit)}"></label>
  </div>
  ${id ? `<label class="chip" style="align-self:flex-start"><input type="checkbox" id="a-arch"${a.archived ? " checked" : ""}><span>Hide this account</span></label>` : ""}
  <p class="hint" style="margin:0">Starting balance is what the account held when you started tracking. For cards, it's what you owed.</p>
  <div class="err" id="a-err"></div>
  <button type="button" class="btn primary block" id="a-save">${ico("check")}${id ? "Save" : "Add account"}</button>`, root => {
    const grp = () => val(root, "grp") || "bank";
    const sync = () => { const lib = GROUPS[grp()].kind === "liability"; root.querySelector("#a-limit-f").hidden = !lib; root.querySelector("#a-open-l").textContent = lib ? "Owed at start" : "Starting balance"; };
    root.querySelectorAll('input[name="grp"]').forEach(r => r.onchange = sync); sync();
    root.querySelector("#a-save").onclick = () => {
      const E = m => root.querySelector("#a-err").textContent = m;
      const name = root.querySelector("#a-name").value.trim(); if (!name) return E("Give the account a name.");
      const g = grp();
      const oRaw = root.querySelector("#a-open").value.trim(), lRaw = root.querySelector("#a-limit").value.trim();
      const opening = oRaw ? parseAmt(oRaw) : 0, limit = lRaw ? parseAmt(lRaw) : 0;
      if (oRaw && opening == null && !isZeroish(oRaw)) return E("Starting balance must be a number.");
      const rec = {...a, name, group: g, opening: opening || 0};
      if (GROUPS[g].kind === "liability" && limit) rec.limit = limit; else delete rec.limit;
      const ar = root.querySelector("#a-arch"); if (ar) rec.archived = ar.checked;
      if (!id) rec.order = Object.keys(S.data.accounts).length;
      S.data.accounts[id || newId()] = rec; save(); closeSheet(); toast(id ? "Account saved" : "Account added");
    };
  });
}
function openPerson(id, kindDefault) {
  const p = id ? S.data.people[id] : {name: "", kind: kindDefault || "rent", detail: "", monthly: 0, dueDay: 1, opening: 0};
  openSheet(id ? "Edit person" : "Add person", `
  <div class="field"><span class="lbl">Why they owe you</span>${tilesHTML("kind", Object.entries(KINDS).map(([k, x]) => [k, x.label, x.icon]), p.kind)}</div>
  <div class="grid2">
    <label class="field"><span class="lbl">Name</span><input class="input" id="p-name" maxlength="50" value="${esc(p.name)}"></label>
    <label class="field"><span class="lbl" id="p-detail-l">Detail</span><input class="input" id="p-detail" maxlength="40" placeholder="Optional" value="${esc(p.detail || "")}"></label>
  </div>
  <div class="grid2" id="p-monthly-f">
    <label class="field"><span class="lbl">Monthly amount</span><input class="input num" id="p-monthly" inputmode="decimal" placeholder="0.00" value="${amtVal(p.monthly)}"></label>
    <label class="field"><span class="lbl">Due day</span><input class="input num" id="p-day" type="number" min="1" max="31" value="${p.dueDay || 1}"></label>
  </div>
  <label class="field"><span class="lbl">Already owes you</span><input class="input num" id="p-open" inputmode="decimal" placeholder="0.00" value="${amtVal(p.opening)}"></label>
  <p class="hint" style="margin:0" id="p-hint"></p>
  ${id ? `<label class="chip" style="align-self:flex-start"><input type="checkbox" id="p-arch"${p.archived ? " checked" : ""}><span>Hide (moved out / settled)</span></label>` : ""}
  <div class="err" id="p-err"></div>
  <button type="button" class="btn primary block" id="p-save">${ico("check")}${id ? "Save" : "Add person"}</button>`, root => {
    const sync = () => {
      const k = val(root, "kind") || "rent";
      root.querySelector("#p-monthly-f").hidden = !KINDS[k].monthly;
      root.querySelector("#p-detail-l").textContent = k === "rent" ? "Unit" : k === "internet" ? "Plan / area" : "Detail";
      root.querySelector("#p-hint").textContent = k === "loan" ? "Enter what they owe you today. Lend more later from their card; it'll come out of the account you pick." : "Amounts owed from before you started tracking count as over 60 days.";
    };
    root.querySelectorAll('input[name="kind"]').forEach(r => r.onchange = sync); sync();
    root.querySelector("#p-save").onclick = () => {
      const E = m => root.querySelector("#p-err").textContent = m;
      const kind = val(root, "kind") || "rent";
      const name = root.querySelector("#p-name").value.trim(); if (!name) return E("Enter their name.");
      let monthly = 0, dueDay = 1;
      if (KINDS[kind].monthly) {
        const mRaw = root.querySelector("#p-monthly").value.trim(); monthly = mRaw ? parseAmt(mRaw) : 0;
        if (mRaw && monthly == null && !isZeroish(mRaw)) return E("Monthly amount must be a number.");
        dueDay = Math.min(31, Math.max(1, parseInt(root.querySelector("#p-day").value, 10) || 1));
      }
      const oRaw = root.querySelector("#p-open").value.trim(); const opening = oRaw ? parseAmt(oRaw) : 0;
      if (oRaw && opening == null && !isZeroish(oRaw)) return E("Amount owed must be a number.");
      const rec = {...p, name, kind, detail: root.querySelector("#p-detail").value.trim(), monthly: monthly || 0, dueDay, opening: opening || 0};
      const ar = root.querySelector("#p-arch"); if (ar) rec.archived = ar.checked;
      S.data.people[id || newId()] = rec; save(); closeSheet(); toast(id ? "Saved" : "Added");
    };
  });
}

/* ---------- nav + boot ---------- */
function go(view) { S.view = view; pref.set("view", view); closeSheet(); window.scrollTo(0, 0); render(); }
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => go(b.dataset.v));
$("#fab").onclick = () => openTxn();
$("#mprev").onclick = () => { S.month = mShift(S.month, -1); render(); };
$("#mnext").onclick = () => { S.month = mShift(S.month, 1); render(); };
window.addEventListener("storage", e => { if (e.key === KEY) { S.data = load(); if (S.data) normalize(S.data); render(); } });
render();
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(r => r.update?.()).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || $("#upd")) return;
    const b = document.createElement("div"); b.id = "upd"; b.className = "toast"; b.style.cssText = "display:flex;gap:12px;align-items:center";
    b.innerHTML = `<span>New version ready</span><button type="button" class="btn primary">Refresh</button>`;
    b.querySelector("button").onclick = () => location.reload();
    $("#toast-root").replaceChildren(b);
  });
}
})();
</script>
</body>
</html>
